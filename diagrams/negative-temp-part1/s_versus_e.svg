<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plot of entropy S on the vertical axis versus energy E on the horizontal axis for a lattice of non-interacting spins in a magnetic field. The curve is a symmetric downward arch: it starts at zero on the left where E is most negative, rises to a maximum of ln 2 at E equals zero in the center, and falls back to zero on the right where E is most positive. A blue straight tangent line touches the rising left half of the arch and has positive slope, labeled plus T, indicating positive temperature. A red straight tangent line touches the falling right half and has negative slope, labeled minus T, indicating negative temperature. Because temperature is the reciprocal of the slope of S versus E, the positive slope gives positive temperature and the negative slope gives negative temperature." style="">
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Entropy versus energy for non-interacting spins: a symmetric arch peaking at ln 2, with a positive-slope tangent (+T) on the left half and a negative-slope tangent (-T) on the right half.</desc>
  <defs>
    <marker id="arrowP" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
