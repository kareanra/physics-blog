<svg xmlns="http://www.w3.org/2000/svg" width="560" height="500" viewBox="0 0 560 500" role="img">
  <title>Encoding a pairing of ten couples as a permutation</title>
  <desc>Ten women in a fixed order face ten men in one shuffled order. Each woman's number is her fixed position; each man's number is his true partner. Two rows match (green) where the man faces his own partner; the other eight do not (red).</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t  { font-size: 14px; fill: #2C2C2A; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .th { font-size: 15px; font-weight: 600; fill: #2C2C2A; }
    @media (prefers-color-scheme: dark){ .t,.th{fill:#E8E6DE;} .ts{fill:#B4B2A9;} }
  </style>

  <text class="th" x="280" y="26" text-anchor="middle">Encoding a pairing: women fixed, men permuted</text>
  <text class="ts" x="280" y="45" text-anchor="middle">each man's number is his true partner; a match is a man facing his own partner</text>

  <text class="t" x="120" y="80" text-anchor="middle">women (fixed order)</text>
  <text class="t" x="430" y="80" text-anchor="middle">men (this shuffle)</text>

  <line x1="154" y1="100" x2="406" y2="100" stroke="#D64545" stroke-width="1.6" opacity="0.45"/>
  <circle cx="280" cy="100" r="7" fill="#D64545"/>
  <circle cx="140" cy="100" r="13" fill="#F0E8F2" stroke="#9C6FA6" stroke-width="1.5"/>
  <text x="140" y="104" text-anchor="middle" font-size="12" fill="#2C2C2A">1</text>
  <text class="ts" x="120" y="104" text-anchor="end">Susie</text>
  <circle cx="420" cy="100" r="13" fill="#E4EDF6" stroke="#3E6DA3" stroke-width="1.5"/>
  <text x="420" y="104" text-anchor="middle" font-size="12" fill="#2C2C2A">3</text>
  <path d="M154 96 L160 100 L154 104 Z" fill="#9C6FA6"/>
  <path d="M406 96 L400 100 L406 104 Z" fill="#3E6DA3"/>
  <line x1="154" y1="136" x2="406" y2="136" stroke="#2E9E5B" stroke-width="1.6" opacity="0.45"/>
  <circle cx="280" cy="136" r="7" fill="#2E9E5B"/>
  <circle cx="140" cy="136" r="13" fill="#F0E8F2" stroke="#9C6FA6" stroke-width="1.5"/>
  <text x="140" y="140" text-anchor="middle" font-size="12" fill="#2C2C2A">2</text>
  <text class="ts" x="120" y="140" text-anchor="end">Esther</text>
  <circle cx="420" cy="136" r="13" fill="#E4EDF6" stroke="#3E6DA3" stroke-width="1.5"/>
  <text x="420" y="140" text-anchor="middle" font-size="12" fill="#2C2C2A">2</text>
  <path d="M154 132 L160 136 L154 140 Z" fill="#9C6FA6"/>
  <path d="M406 132 L400 136 L406 140 Z" fill="#3E6DA3"/>
  <line x1="154" y1="172" x2="406" y2="172" stroke="#D64545" stroke-width="1.6" opacity="0.45"/>
  <circle cx="280" cy="172" r="7" fill="#D64545"/>
  <circle cx="140" cy="172" r="13" fill="#F0E8F2" stroke="#9C6FA6" stroke-width="1.5"/>
  <text x="140" y="176" text-anchor="middle" font-size="12" fill="#2C2C2A">3</text>
  <text class="ts" x="120" y="176" text-anchor="end">Ethyl</text>
  <circle cx="420" cy="172" r="13" fill="#E4EDF6" stroke="#3E6DA3" stroke-width="1.5"/>
  <text x="420" y="176" text-anchor="middle" font-size="12" fill="#2C2C2A">1</text>
  <path d="M154 168 L160 172 L154 176 Z" fill="#9C6FA6"/>
  <path d="M406 168 L400 172 L406 176 Z" fill="#3E6DA3"/>
  <line x1="154" y1="208" x2="406" y2="208" stroke="#D64545" stroke-width="1.6" opacity="0.45"/>
  <circle cx="280" cy="208" r="7" fill="#D64545"/>
  <circle cx="140" cy="208" r="13" fill="#F0E8F2" stroke="#9C6FA6" stroke-width="1.5"/>
  <text x="140" y="212" text-anchor="middle" font-size="12" fill="#2C2C2A">4</text>
  <text class="ts" x="120" y="212" text-anchor="end">Methyl</text>
