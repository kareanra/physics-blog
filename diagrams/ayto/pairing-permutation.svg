  <text x="420" y="212" text-anchor="middle" font-size="12" fill="#2C2C2A">5</text>
  <path d="M154 204 L160 208 L154 212 Z" fill="#9C6FA6"/>
  <path d="M406 204 L400 208 L406 212 Z" fill="#3E6DA3"/>
