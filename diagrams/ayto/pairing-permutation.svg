  <text x="420" y="320" text-anchor="middle" font-size="12" fill="#2C2C2A">8</text>
  <path d="M154 312 L160 316 L154 320 Z" fill="#9C6FA6"/>
  <path d="M406 312 L400 316 L406 320 Z" fill="#3E6DA3"/>
  <line x1="154" y1="352" x2="406" y2="352" stroke="#D64545" stroke-width="1.6" opacity="0.45"/>
  <circle cx="280" cy="352" r="7" fill="#D64545"/>
  <circle cx="140" cy="352" r="13" fill="#F0E8F2" stroke="#9C6FA6" stroke-width="1.5"/>
  <text x="140" y="356" text-anchor="middle" font-size="12" fill="#2C2C2A">8</text>
  <circle cx="420" cy="352" r="13" fill="#E4EDF6" stroke="#3E6DA3" stroke-width="1.5"/>
  <text x="420" y="356" text-anchor="middle" font-size="12" fill="#2C2C2A">9</text>
  <path d="M154 348 L160 352 L154 356 Z" fill="#9C6FA6"/>
  <path d="M406 348 L400 352 L406 356 Z" fill="#3E6DA3"/>
  <line x1="154" y1="388" x2="406" y2="388" stroke="#D64545" stroke-width="1.6" opacity="0.45"/>
  <circle cx="280" cy="388" r="7" fill="#D64545"/>
  <circle cx="140" cy="388" r="13" fill="#F0E8F2" stroke="#9C6FA6" stroke-width="1.5"/>
  <text x="140" y="392" text-anchor="middle" font-size="12" fill="#2C2C2A">9</text>
  <circle cx="420" cy="388" r="13" fill="#E4EDF6" stroke="#3E6DA3" stroke-width="1.5"/>
  <text x="420" y="392" text-anchor="middle" font-size="12" fill="#2C2C2A">10</text>
  <path d="M154 384 L160 388 L154 392 Z" fill="#9C6FA6"/>
  <path d="M406 384 L400 388 L406 392 Z" fill="#3E6DA3"/>
  <line x1="154" y1="424" x2="406" y2="424" stroke="#D64545" stroke-width="1.6" opacity="0.45"/>
  <circle cx="280" cy="424" r="7" fill="#D64545"/>
  <circle cx="140" cy="424" r="13" fill="#F0E8F2" stroke="#9C6FA6" stroke-width="1.5"/>
  <text x="140" y="428" text-anchor="middle" font-size="12" fill="#2C2C2A">10</text>
  <circle cx="420" cy="424" r="13" fill="#E4EDF6" stroke="#3E6DA3" stroke-width="1.5"/>
  <text x="420" y="428" text-anchor="middle" font-size="12" fill="#2C2C2A">7</text>
  <path d="M154 420 L160 424 L154 428 Z" fill="#9C6FA6"/>
  <path d="M406 420 L400 424 L406 428 Z" fill="#3E6DA3"/>

  <circle cx="150" cy="464" r="7" fill="#2E9E5B"/>
  <text class="ts" x="164" y="468" text-anchor="start">correct match — 2</text>
  <circle cx="320" cy="464" r="7" fill="#D64545"/>
  <text class="ts" x="334" y="468" text-anchor="start">incorrect — 8</text>
  <text class="ts" x="280" y="490" text-anchor="middle">shuffling the men gives all 10! = 3,628,800 pairings</text>
</svg>
