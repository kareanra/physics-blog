  <circle cx="280" cy="244" r="7" fill="#D64545"/>
  <circle cx="140" cy="244" r="13" fill="#F0E8F2" stroke="#9C6FA6" stroke-width="1.5"/>
  <text x="140" y="248" text-anchor="middle" font-size="12" fill="#2C2C2A">5</text>
  <circle cx="420" cy="244" r="13" fill="#E4EDF6" stroke="#3E6DA3" stroke-width="1.5"/>
  <text x="420" y="248" text-anchor="middle" font-size="12" fill="#2C2C2A">4</text>
  <path d="M154 240 L160 244 L154 248 Z" fill="#9C6FA6"/>
  <path d="M406 240 L400 244 L406 248 Z" fill="#3E6DA3"/>
  <line x1="154" y1="280" x2="406" y2="280" stroke="#2E9E5B" stroke-width="1.6" opacity="0.45"/>
  <circle cx="280" cy="280" r="7" fill="#2E9E5B"/>
  <circle cx="140" cy="280" r="13" fill="#F0E8F2" stroke="#9C6FA6" stroke-width="1.5"/>
  <text x="140" y="284" text-anchor="middle" font-size="12" fill="#2C2C2A">6</text>
  <circle cx="420" cy="280" r="13" fill="#E4EDF6" stroke="#3E6DA3" stroke-width="1.5"/>
  <text x="420" y="284" text-anchor="middle" font-size="12" fill="#2C2C2A">6</text>
  <path d="M154 276 L160 280 L154 284 Z" fill="#9C6FA6"/>
  <path d="M406 276 L400 280 L406 284 Z" fill="#3E6DA3"/>
  <line x1="154" y1="316" x2="406" y2="316" stroke="#D64545" stroke-width="1.6" opacity="0.45"/>
  <circle cx="280" cy="316" r="7" fill="#D64545"/>
  <circle cx="140" cy="316" r="13" fill="#F0E8F2" stroke="#9C6FA6" stroke-width="1.5"/>
  <text x="140" y="320" text-anchor="middle" font-size="12" fill="#2C2C2A">7</text>
